name: CINEBLOCK CI

on:
  push:
    branches:
      - main
      - feature/shotlist-equipment-lens-dropdowns
  pull_request:
    branches:
      - main
      - feature/shotlist-equipment-lens-dropdowns

permissions:
  contents: read

jobs:
  verify:
    name: Test, lint, and build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run automated tests
        run: npm test
      - name: Run lint
        run: npm run lint
      - name: Build production app
        run: npm run build
